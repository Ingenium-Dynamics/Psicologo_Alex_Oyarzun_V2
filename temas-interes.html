  <script>
    // Video switcher
    const videoLinks = document.querySelectorAll("[data-video-src]");
    const videoContainer = document.getElementById("videoContainer");

    videoLinks.forEach((link) => {
      link.addEventListener("click", function () {
        videoLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        const videoSrc = this.getAttribute("data-video-src");
        videoContainer.innerHTML = `<iframe class="video-iframe" src="${videoSrc}" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
      });
    });

    // Footer loader
    fetch("footer.html")
      .then((response) => response.text())
      .then((data) => {
        document.getElementById("include-footer").innerHTML = data;
        document.getElementById("year").textContent = new Date().getFullYear();
      });
  </script>
